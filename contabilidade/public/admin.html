<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel de Contatos</title>
<style>
  :root { --bg: #f5f7fa; --card: #fff; --texto: #1d2733; --suave: #5b6878; --borda: #e2e7ee; --marca: #0f6e5c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11161c; --card: #1a2129; --texto: #e6ebf0; --suave: #9aa7b5; --borda: #2a333d; --marca: #2bb596; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--texto); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 20px; }
  input { padding: 12px; border: 1px solid var(--borda); border-radius: 8px; font: inherit; background: var(--bg); color: var(--texto); }
  button, .btn { font: inherit; cursor: pointer; border: 0; border-radius: 8px; background: var(--marca); color: #fff; padding: 12px 18px; font-weight: 600; text-decoration: none; display: inline-block; }
  .topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpis div { background: var(--card); border: 1px solid var(--borda); border-radius: 12px; padding: 14px; }
  .kpis b { display: block; font-size: 1.6rem; color: var(--marca); }
  .kpis span { color: var(--suave); font-size: .85rem; }
  .tabela { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  th { color: var(--suave); font-weight: 600; font-size: .8rem; text-transform: uppercase; }
  td small { color: var(--suave); }
  .erro { color: #c0392b; margin-top: 10px; }
  .wa { background: #25d366; padding: 6px 12px; font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card" style="max-width:380px;margin:60px auto">
    <h1>Painel do escritório</h1>
    <form id="formLogin" style="display:flex;gap:8px">
      <input id="senha" type="password" placeholder="Senha" style="flex:1" autocomplete="current-password">
      <button>Entrar</button>
    </form>
    <div class="erro" id="erroLogin"></div>
  </div>

  <div id="painel" hidden>
    <div class="topo">
      <h1 style="margin:0">Contatos recebidos pelo site</h1>
      <div style="display:flex;gap:8px"><button id="csv">Baixar planilha (CSV)</button><button id="atualizar">Atualizar</button></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="card tabela"><table><thead><tr><th>Quando</th><th>Nome</th><th>CNPJ</th><th>Pedido</th><th>Total</th><th></th></tr></thead><tbody id="linhas"></tbody></table></div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (v) => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtCnpj = (c) => c && c.length === 14 ? `${c.slice(0, 2)}.${c.slice(2, 5)}.${c.slice(5, 8)}/${c.slice(8, 12)}-${c.slice(12)}` : (c || '');
let senha = '';
try { senha = sessionStorage.getItem('senhaAdmin') || ''; } catch {}
let dados = null;

async function carrega() {
  const r = await fetch('/api/admin/contatos', { headers: { 'x-admin-senha': senha } });
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || 'Erro');
  dados = j;
  $('#login').hidden = true;
  $('#painel').hidden = false;
  render();
}

function render() {
  const { contatos, nomes } = dados;
  const hoje = new Date().toISOString().slice(0, 10);
  const semana = Date.now() - 7 * 864e5;
  const soma = contatos.reduce((t, c) => t + (c.total || 0), 0);
  $('#kpis').innerHTML = `
    <div><b>${contatos.length}</b><span>contatos no total</span></div>
    <div><b>${contatos.filter((c) => c.em.slice(0, 10) === hoje).length}</b><span>hoje</span></div>
    <div><b>${contatos.filter((c) => Date.parse(c.em) > semana).length}</b><span>últimos 7 dias</span></div>
    <div><b>${brl(soma)}</b><span>em orçamentos</span></div>`;
  $('#linhas').innerHTML = contatos.length ? contatos.map((c) => `
    <tr>
      <td>${new Date(c.em).toLocaleString('pt-BR')}</td>
      <td>${esc(c.nome)}<br><small>${esc(c.telefone)}</small></td>
      <td>${esc(fmtCnpj(c.cnpj))}</td>
      <td>${c.assunto ? `<b>${esc(c.assunto)}</b><br>` : ''}${c.mensagem ? `${esc(c.mensagem)}<br>` : ''}${c.email ? `<small>${esc(c.email)}</small><br>` : ''}${c.servicos.map((s) => esc(nomes[s] || s)).join('<br>')}</td>
      <td>${brl(c.total)}</td>
      <td><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${c.telefone.length <= 11 ? '55' : ''}${esc(c.telefone)}?text=${encodeURIComponent(`Olá ${c.nome}! Aqui é do escritório, recebemos seu pedido pelo site.`)}">WhatsApp</a></td>
    </tr>`).join('') : '<tr><td colspan="6" style="color:var(--suave)">Nenhum contato ainda.</td></tr>';
}

$('#formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  senha = $('#senha').value;
  try {
    await carrega();
    try { sessionStorage.setItem('senhaAdmin', senha); } catch {}
  } catch (err) { $('#erroLogin').textContent = err.message; }
});
$('#atualizar').addEventListener('click', () => carrega().catch((e) => alert(e.message)));
$('#csv').addEventListener('click', () => {
  const linhas = [['data', 'nome', 'telefone', 'email', 'cnpj', 'assunto', 'mensagem', 'servicos', 'total']].concat(dados.contatos.map((c) =>
    [c.em, c.nome, c.telefone, c.email || '', fmtCnpj(c.cnpj), c.assunto || '', c.mensagem || '', c.servicos.map((s) => dados.nomes[s] || s).join(' | '), String(c.total || 0).replace('.', ',')]));
  const csv = linhas.map((l) => l.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'contatos.csv';
  a.click();
});
if (senha) carrega().catch(() => {});
</script>
</body>
</html>
