<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif">
  <!-- prédio ao fundo -->
  <g opacity=".9">
    <rect x="360" y="70" width="140" height="250" rx="10" fill="#1d4e89"/>
    <rect x="360" y="70" width="140" height="26" rx="10" fill="#0b2545"/>
    <g fill="#9cc0ec">
      <rect x="380" y="112" width="22" height="18" rx="3"/><rect x="419" y="112" width="22" height="18" rx="3"/><rect x="458" y="112" width="22" height="18" rx="3"/>
      <rect x="380" y="146" width="22" height="18" rx="3"/><rect x="419" y="146" width="22" height="18" rx="3" fill="#c9a227"/><rect x="458" y="146" width="22" height="18" rx="3"/>
      <rect x="380" y="180" width="22" height="18" rx="3"/><rect x="419" y="180" width="22" height="18" rx="3"/><rect x="458" y="180" width="22" height="18" rx="3" fill="#c9a227"/>
      <rect x="380" y="214" width="22" height="18" rx="3" fill="#c9a227"/><rect x="419" y="214" width="22" height="18" rx="3"/><rect x="458" y="214" width="22" height="18" rx="3"/>
    </g>
    <rect x="414" y="270" width="32" height="50" rx="4" fill="#0b2545"/>
  </g>
  <!-- contrato social -->
  <g transform="rotate(-4 220 200)">
    <rect x="110" y="50" width="230" height="290" rx="16" fill="#fff" stroke="#e3e8ef" stroke-width="2"/>
    <rect x="110" y="50" width="230" height="54" rx="16" fill="#0b2545"/>
    <rect x="110" y="88" width="230" height="16" fill="#0b2545"/>
    <text x="225" y="84" text-anchor="middle" fill="#fff" font-size="17" font-weight="800" letter-spacing="1">CONTRATO SOCIAL</text>
    <g fill="#dfe6f0">
      <rect x="136" y="128" width="178" height="9" rx="4.5"/><rect x="136" y="148" width="150" height="9" rx="4.5"/>
      <rect x="136" y="168" width="170" height="9" rx="4.5"/><rect x="136" y="188" width="120" height="9" rx="4.5"/>
      <rect x="136" y="216" width="178" height="9" rx="4.5"/><rect x="136" y="236" width="140" height="9" rx="4.5"/>
    </g>
    <path d="M140 300c14-18 22 6 34-6s16-14 24 0 14 4 22-4" stroke="#1d4e89" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="136" y1="312" x2="236" y2="312" stroke="#c4cfdd" stroke-width="2"/>
    <circle cx="292" cy="296" r="30" fill="#c9a227"/>
    <circle cx="292" cy="296" r="22" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M281 296l8 8 15-16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- cartão CNPJ -->
  <g>
    <rect x="40" y="268" width="270" height="128" rx="18" fill="#0b2545"/>
    <rect x="40" y="268" width="270" height="128" rx="18" fill="url(#brilho)"/>
    <text x="64" y="304" fill="#c9a227" font-size="15" font-weight="800" letter-spacing="2">CNPJ</text>
    <text x="64" y="338" fill="#fff" font-size="19" font-weight="700">00.000.000/0001-00</text>
    <text x="64" y="370" fill="#9cb3d1" font-size="13">SUA EMPRESA LTDA</text>
    <rect x="220" y="353" width="70" height="26" rx="13" fill="#1e7a4f"/>
    <text x="255" y="371" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">ATIVA</text>
  </g>
  <!-- selo alvará -->
  <g>
    <rect x="392" y="330" width="138" height="56" rx="16" fill="#fff" stroke="#e3e8ef" stroke-width="2"/>
    <circle cx="420" cy="358" r="15" fill="#e6f5ec"/>
    <path d="M413 358l5 5 9-10" stroke="#1e7a4f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="444" y="354" fill="#0b2545" font-size="14" font-weight="800">Alvará</text>
    <text x="444" y="372" fill="#5d6b7c" font-size="12">liberado</text>
  </g>
  <defs>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
