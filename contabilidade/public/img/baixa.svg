    <text x="324" y="148" fill="#c9a227" font-size="13" font-weight="800" letter-spacing="1.5">ENCERRAMENTO</text>
    <g font-size="15" fill="#fff" font-weight="600">
      <circle cx="336" cy="182" r="12" fill="#1e7a4f"/><path d="M330 182l4 4 8-9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="187">Receita Federal</text>
      <circle cx="336" cy="222" r="12" fill="#1e7a4f"/><path d="M330 222l4 4 8-9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="227">Junta Comercial</text>
