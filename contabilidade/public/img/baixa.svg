    <text x="106" y="92" fill="#0b2545" font-size="15" font-weight="800" letter-spacing="1">DISTRATO SOCIAL</text>
    <rect x="106" y="104" width="70" height="4" rx="2" fill="#c9a227"/>
    <g fill="#dfe6f0">
      <rect x="106" y="130" width="196" height="9" rx="4.5"/><rect x="106" y="150" width="170" height="9" rx="4.5"/>
      <rect x="106" y="170" width="186" height="9" rx="4.5"/><rect x="106" y="190" width="120" height="9" rx="4.5"/>
      <rect x="106" y="300" width="196" height="9" rx="4.5"/><rect x="106" y="320" width="150" height="9" rx="4.5"/>
    </g>
    <g transform="rotate(-14 205 250)">
