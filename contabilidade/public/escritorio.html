<div id="telaLogin" class="login" hidden>
  <form id="formLogin" class="login-card">
    <div class="logo-g"><span class="mono">VJ</span><div><b>V&amp;J</b><small>Assessoria Contábil</small></div></div>
    <h1>Painel do escritório</h1>
    <p>Entre com a senha do painel ou com a sua conta de dono na <a href="/area">Área do Cliente</a>.</p>
    <input id="senha" type="password" placeholder="Senha do painel" autocomplete="current-password" required>
    <button class="btn primario largo">Entrar</button>
    <p id="erroLogin" class="msg erro" hidden></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="lateral">
    <div class="logo-g"><span class="mono">VJ</span><div><b>V&amp;J</b><small>Escritório</small></div></div>
    <nav>
      <a href="#/empresas" data-menu="empresas"><svg class="i"><use href="#i-predio"/></svg>Empresas</a>
      <a href="#/pedidos" data-menu="pedidos"><svg class="i"><use href="#i-fila"/></svg>Pedidos de nota<span class="contador" id="contPedidos" hidden></span></a>
    </nav>
    <div class="lateral-pe">
      <a href="/admin"><svg class="i"><use href="#i-link"/></svg>Contatos e outras ferramentas</a>
      <a href="#" id="sair"><svg class="i"><use href="#i-sair"/></svg>Sair</a>
    </div>
  </aside>
  <main id="conteudo" class="conteudo"></main>
</div>

<dialog id="dlg" class="dlg"><div id="dlgCorpo"></div></dialog>
<div id="aviso" class="aviso" hidden></div>
<script src="escritorio.js"></script>
</body>
</html>
